<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' https://cdn.jsdelivr.net data:; connect-src 'self' https://cdn.jsdelivr.net; media-src 'self' blob: data:; worker-src 'self' blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notto Quick Note</title>
  <style>
    :root {
      --bg-opacity: 0.85;
      --blur-amount: 20px;
      /* iOS-like liquid glass with vibrancy */
      --bg-overlay: rgba(255, 255, 255, var(--bg-opacity));
      --bg-gradient: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
      /* Text colors remain opaque regardless of background transparency */
      --text-primary: rgb(0, 0, 0);
      --text-secondary: rgb(102, 102, 102);
      --border-subtle: rgba(255, 255, 255, 0.2);
      --border-bright: rgba(255, 255, 255, 0.4);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.08);
      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Stealth mode OLED black theme with translucence */
    body.stealth-mode {
      --bg-overlay: rgba(0, 0, 0, var(--bg-opacity));
      --bg-gradient: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
      --text-primary: rgb(255, 255, 255);
      --text-secondary: rgb(176, 176, 176);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-bright: rgba(255, 255, 255, 0.3);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: transparent !important;
      overflow: hidden;
      margin: 0;
      padding: 0;
      touch-action: pan-y;
      -ms-touch-action: pan-y;
    }

    body {
      font-family: var(--font-system);
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      zoom: 1 !important;
      transform: scale(1);
      transform-origin: 0 0;
      -moz-transform: scale(1);
      -moz-transform-origin: 0 0;
    }

    #overlay {
      background: var(--bg-overlay);
      backdrop-filter: blur(var(--blur-amount)) saturate(220%) brightness(1.05);
      -webkit-backdrop-filter: blur(var(--blur-amount)) saturate(220%) brightness(1.05);
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-bright);
      box-shadow: var(--shadow), inset 0 1px 1px var(--border-subtle);
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      max-height: 100%;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      -webkit-mask-image: -webkit-radial-gradient(white, white);
      mask-image: radial-gradient(white, white);
      clip-path: inset(0 round 24px);
      transition: none !important;
      will-change: auto;
    }

    #overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-gradient);
      pointer-events: none;
      border-radius: 24px;
      z-index: -1;
      transition: none !important;
    }

    #header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .header-center-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-right: 28px;
    }

    #title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #ai-status {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    #ai-status.active {
      display: flex;
    }

    .recording-dot {
      width: 8px;
      height: 8px;
      background-color: #ff3b30;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 59, 48, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }

      100% {
        opacity: 1;
      }
    }

    #ai-pause-btn,
    #ai-stop-btn {
      -webkit-app-region: no-drag;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
      margin-left: 4px;
    }

    #ai-pause-btn:hover,
    #ai-stop-btn:hover {
      background: var(--background-secondary);
      border-color: var(--text-secondary);
      color: var(--text-primary);
    }

    #ai-pause-btn:active,
    #ai-stop-btn:active {
      background: var(--border);
    }

    #ai-pause-btn {
      border: 1px solid #000000;
    }

    #ai-pause-btn.paused {
      background: rgba(52, 199, 89, 0.1);
      color: #34c759;
      border-color: rgba(52, 199, 89, 0.3);
    }

    #ai-pause-btn.paused:hover {
      background: #34c759;
      border-color: #34c759;
      color: white;
    }

    /* Note controls (shown when no meeting) */
    #note-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    body.meeting-active #note-controls {
      display: none;
    }

    /* Recording controls (shown during meeting) */
    #recording-controls {
      display: none;
      align-items: center;
      gap: 8px;
    }

    body.meeting-active #recording-controls {
      display: flex;
    }

    .header-btn {
      -webkit-app-region: no-drag;
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .header-btn:hover {
      background: var(--border-subtle);
      border-color: var(--text-secondary);
      color: var(--text-primary);
    }

    .header-btn:active {
      background: var(--border-bright);
    }

    .header-btn svg {
      width: 12px;
      height: 12px;
    }

    #start-meeting-btn {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    body.stealth-mode #start-meeting-btn {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    #start-meeting-btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    #ai-stop-btn.stop-btn-red {
      background: rgb(220, 38, 38);
      color: white;
      border: none;
    }

    #ai-stop-btn.stop-btn-red:hover {
      background: rgb(239, 68, 68);
      transform: scale(1.05);
    }

    .header-btn svg {
      width: 14px;
      height: 14px;
    }


    #drag-handle {
      width: 24px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: move;
      opacity: 1;
      transition: opacity 0.15s ease;
      flex-shrink: 0;
      -webkit-app-region: drag;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    #drag-handle svg {
      stroke: var(--text-secondary);
      fill: var(--text-secondary);
    }

    #notes-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
      -webkit-app-region: no-drag;
      contain: content;
    }

    #personal-notes-textarea {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      font-family: var(--font-system);
      outline: none;
      color: var(--text-primary);
      padding: 0;
      resize: none;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      line-height: 1.6;
      /* GPU acceleration and layer optimization */
      transform: translateZ(0);
      will-change: transform;
    }

    #personal-notes-textarea::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }

    #personal-notes-textarea::-webkit-scrollbar {
      display: none;
    }

    textarea,
    button,
    input,
    select {
      -webkit-app-region: no-drag;
    }
  </style>
</head>

<body>
  <div id="overlay">
    <div id="header">
      <div id="title">
        <span id="title-text">Personal Note</span>
      </div>
      <div class="header-center-group">

        <div id="note-controls">
          <button id="new-note-btn" class="header-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New Note
          </button>
          <button id="start-meeting-btn" class="header-btn">
            Start meeting
          </button>
        </div>
        <div id="recording-controls">
          <div id="ai-status">
            <div class="recording-dot"></div>
            <span>Recording</span>
          </div>
          <button id="ai-pause-btn" class="header-btn">
            <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            <svg class="resume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
          <button id="ai-stop-btn" class="header-btn stop-btn-red">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
          </button>
        </div>
      </div>
      <div id="drag-handle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="5" r="1" />
          <circle cx="9" cy="12" r="1" />
          <circle cx="9" cy="19" r="1" />
          <circle cx="15" cy="5" r="1" />
          <circle cx="15" cy="12" r="1" />
          <circle cx="15" cy="19" r="1" />
        </svg>
      </div>
    </div>
    <div id="notes-container">
      <textarea id="personal-notes-textarea" placeholder="Jot down personal notes here..." spellcheck="false"
        autocorrect="off" autocapitalize="off" autocomplete="off"></textarea>
    </div>
  </div>

  <script src="dist/notes-float.js"></script>
</body>

</html>
