<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title></title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' https://cdn.jsdelivr.net data:; connect-src 'self' https://cdn.jsdelivr.net; media-src 'self' blob: data:; worker-src 'self' blob:;">
  <style>
    :root {
      --bg-opacity: 1;

      /* Solid backgrounds matching history panel */
      --bg-overlay: rgba(255, 255, 255, var(--bg-opacity));
      --bg-gradient: transparent;
      /* Text colors */
      --text-primary: rgb(0, 0, 0);
      --text-secondary: rgb(100, 100, 100);
      --border-subtle: rgba(0, 0, 0, 0.1);
      --border-bright: rgba(0, 0, 0, 0.2);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.08);
      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Stealth mode - solid dark background matching history panel */
    body.stealth-mode {
      --bg-overlay: rgba(20, 20, 20, var(--bg-opacity));
      --bg-gradient: transparent;
      /* Enhanced contrast: lighter and bolder for dark theme */
      --text-primary: rgb(255, 255, 255);
      --text-secondary: rgb(220, 220, 220);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-bright: rgba(255, 255, 255, 0.3);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: transparent !important;
      overflow: hidden;
      margin: 0;
      padding: 0;
      /* Disable zoom */
      touch-action: pan-y;
      -ms-touch-action: pan-y;
    }

    body {
      font-family: var(--font-system);
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      padding: 0;
      margin: 0;
      /* Disable zoom */
      zoom: 1 !important;
      transform: scale(1);
      transform-origin: 0 0;
      -moz-transform: scale(1);
      -moz-transform-origin: 0 0;
    }

    #overlay {
      background: var(--bg-overlay);
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-bright);
      box-shadow: var(--shadow), inset 0 1px 1px var(--border-subtle);
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      max-height: 100%;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      clip-path: inset(0 round 24px);
      padding-bottom: 0;
      /* Disable all transitions for instant resize */
      transition: none !important;
    }

    /* Gradient overlay for liquid glass depth */
    #overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-gradient);
      pointer-events: none;
      border-radius: 24px;
      z-index: -1;
      /* Disable transitions for instant resize */
      transition: none !important;
    }

    #input-container {
      -webkit-app-region: no-drag;
    }

    #chat-container {
      -webkit-app-region: no-drag;
    }

    textarea,
    button,
    input,
    select {
      -webkit-app-region: no-drag;
    }

    #input-container {
      padding: 10px 16px;
      display: block;
      flex-shrink: 0;
      min-height: 44px;
      position: relative;
    }

    #input-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    /* Container for buttons to keep them at top */
    #input-container>button,
    #input-container>#drag-handle {
      margin-top: 0;
    }

    #chat-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      font-family: var(--font-system);
      outline: none;
      color: var(--text-primary);
      padding: 4px 0;
      resize: none;
      overflow-y: hidden;
      max-height: 150px;
      min-height: 20px;
      opacity: 1;
      font-weight: 700;
      line-height: 1.4;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
      /* Performance optimizations for input */
      will-change: height;
      transform: translateZ(0);
    }

    /* Only show scrollbar when content exceeds max-height */
    #chat-input.scrollable {
      overflow-y: auto;
    }

    /* Custom slim scrollbar for textarea - only shows after ~8 lines */
    #chat-input::-webkit-scrollbar {
      width: 4px;
    }

    #chat-input::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat-input::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 2px;
    }

    #chat-input::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }

    #chat-input::placeholder {
      color: rgb(0, 0, 0);
      opacity: 0.7;
      font-weight: 600;
    }

    /* Dark theme placeholder */
    body.stealth-mode #chat-input::placeholder {
      color: rgb(255, 255, 255);
      opacity: 0.7;
    }

    .note-mention-list {
      display: none;
      margin-top: 8px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(18px);
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.14);
    }

    body.stealth-mode .note-mention-list {
      background: rgba(28, 28, 30, 0.94);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }

    .note-mention-item,
    .note-mention-empty {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 10px 12px;
      border: none;
      background: transparent;
      text-align: left;
      color: var(--text-primary);
      font: inherit;
    }

    .note-mention-item {
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .note-mention-item:hover,
    .note-mention-item.active {
      background: rgba(0, 0, 0, 0.07);
    }

    body.stealth-mode .note-mention-item:hover,
    body.stealth-mode .note-mention-item.active {
      background: rgba(255, 255, 255, 0.08);
    }

    .note-mention-title {
      font-size: 13px;
      font-weight: 700;
    }

    .note-mention-preview,
    .note-mention-empty {
      font-size: 12px;
      line-height: 1.35;
      color: var(--text-secondary);
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: rgba(0, 0, 0, 0.20);
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
      opacity: 1;
    }

    .icon-btn:hover {
      background: rgba(0, 0, 0, 0.30);
    }

    /* Dark theme icon buttons */
    body.stealth-mode .icon-btn {
      background: rgba(255, 255, 255, 0.15);
    }

    body.stealth-mode .icon-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-primary);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #attach-file-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }

    #send-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: rgb(0, 0, 0);
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    #send-btn svg {
      position: absolute;
      width: 14px;
      height: 14px;
      stroke: white;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #send-btn .send-icon {
      opacity: 0;
      transform: scale(0.5) rotate(-45deg);
    }

    #send-btn .voice-icon {
      opacity: 1;
      transform: scale(1);
    }

    #send-btn .stop-icon {
      opacity: 0;
      transform: scale(0.5);
    }

    #send-btn .loading-icon {
      opacity: 0;
      transform: scale(0.5);
    }

    #send-btn.has-text .send-icon {
      opacity: 1;
      transform: scale(1.1);
    }

    #send-btn.has-text .voice-icon {
      opacity: 0;
      transform: scale(0.5);
    }

    /* Recording state - show stop icon */
    #send-btn.is-recording .voice-icon,
    #send-btn.is-recording .send-icon,
    #send-btn.is-recording .loading-icon {
      opacity: 0;
      transform: scale(0.5);
    }

    #send-btn.is-recording .stop-icon {
      opacity: 1;
      transform: scale(1);
    }

    /* Processing state - show loading spinner */
    #send-btn.is-processing .voice-icon,
    #send-btn.is-processing .send-icon,
    #send-btn.is-processing .stop-icon {
      opacity: 0;
      transform: scale(0.5);
    }

    #send-btn.is-processing .loading-icon {
      opacity: 1;
      transform: scale(1);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* Generating state - show stop icon with red highlight */
    /* Generating state - show stop icon with red highlight */
    #send-btn.is-generating {
      background: rgb(220, 38, 38);
      /* Red-600 */
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    #send-btn.is-generating:hover {
      background: rgb(239, 68, 68) !important;
      /* Red-500 (lighter/brighter) */
      transform: scale(1.05);
    }

    #send-btn.is-generating .voice-icon,
    #send-btn.is-generating .send-icon,
    #send-btn.is-generating .loading-icon {
      opacity: 0;
      transform: scale(0.5);
    }

    #send-btn.is-generating .stop-icon {
      opacity: 1;
      transform: scale(1);
    }

    body.stealth-mode #send-btn.is-generating {
      background: rgb(220, 38, 38);
    }

    body.stealth-mode #send-btn.is-generating svg {
      stroke: white;
    }

    body.stealth-mode #send-btn.is-generating:hover {
      background: rgb(239, 68, 68) !important;
    }

    #send-btn:hover {
      transform: scale(1.05);
      background: rgb(30, 30, 30);
    }

    #send-btn:active {
      transform: scale(0.95);
    }

    /* Dark theme send button */
    body.stealth-mode #send-btn {
      background: rgb(255, 255, 255);
    }

    body.stealth-mode #send-btn svg {
      stroke: rgb(0, 0, 0);
    }

    body.stealth-mode #send-btn:hover {
      background: rgb(240, 240, 240);
    }

    #send-btn:active {
      transform: scale(0.95);
    }

    #send-btn svg {
      width: 14px;
      height: 14px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #drag-handle {
      width: 24px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: move;
      opacity: 1;
      transition: opacity 0.15s ease;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }

    #drag-handle:hover {
      opacity: 1;
    }

    #drag-handle svg {
      stroke: var(--text-secondary);
      fill: var(--text-secondary);
      stroke-width: 2.5;
    }

    #chat-container {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 20px 10px 20px;
      display: none;
      flex-direction: column;
      gap: 16px;
      /* GPU acceleration and CSS containment for performance */
      will-change: scroll-position;
      transform: translate3d(0, 0, 0);
      -webkit-overflow-scrolling: touch;
      -webkit-transform: translateZ(0);
      backface-visibility: hidden;
      contain: layout style paint;
    }

    .message {
      contain: layout style;
    }

    #chat-container:not(:empty) {
      display: flex;
    }

    .message {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      word-wrap: break-word;
      opacity: 1 !important;
      padding: 12px 14px;
      border-radius: 10px;
    }

    .message.user {
      font-size: 13px;
      opacity: 1 !important;
      font-weight: 600;
      background: transparent;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    /* Dark theme message borders */
    body.stealth-mode .message.user {
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    body.stealth-mode .message.assistant {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .message.assistant {
      opacity: 1 !important;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    /* Markdown styling for assistant messages */
    .message.assistant h1,
    .message.assistant h2,
    .message.assistant h3 {
      font-weight: 700;
      margin: 0.5em 0 0.3em 0;
      line-height: 1.3;
    }

    .message.assistant h1 {
      font-size: 1.4em;
    }

    .message.assistant h2 {
      font-size: 1.2em;
    }

    .message.assistant h3 {
      font-size: 1.1em;
    }

    .message.assistant p {
      margin: 0.5em 0;
    }

    .message.assistant ul,
    .message.assistant ol {
      margin: 0.5em 0;
      padding-left: 1.5em;
    }

    .message.assistant li {
      margin: 0.2em 0;
    }

    .message.assistant code {
      background: rgba(0, 0, 0, 0.08);
      padding: 0.1em 0.3em;
      border-radius: 3px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.9em;
    }

    .message.assistant pre {
      background: rgba(0, 0, 0, 0.08);
      padding: 0.8em;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0.5em 0;
    }

    .message.assistant pre code {
      background: none;
      padding: 0;
    }

    .message.assistant strong {
      font-weight: 700;
    }

    .message.assistant em {
      font-style: italic;
    }

    .message.assistant blockquote {
      border-left: 3px solid rgba(0, 0, 0, 0.2);
      padding-left: 1em;
      margin: 0.5em 0;
      opacity: 0.8;
    }

    .message.assistant table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.5em 0;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      overflow: hidden;
    }

    .message.assistant th,
    .message.assistant td {
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 8px 12px;
      text-align: left;
    }

    .message.assistant th {
      background: rgba(0, 0, 0, 0.08);
      font-weight: 700;
    }

    .message.assistant tr:nth-child(even) {
      background: rgba(0, 0, 0, 0.03);
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing-indicator span {
      width: 4px;
      height: 4px;
      background: var(--text-secondary);
      border-radius: 50%;
      opacity: 1;
      animation: pulse 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: -0.16s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0s;
    }

    @keyframes pulse {

      0%,
      80%,
      100% {
        opacity: 0.4;
      }

      40% {
        opacity: 1;
      }
    }

    /* Custom scrollbar - wider and matching message bubbles */
    #chat-container::-webkit-scrollbar {
      width: 8px;
      display: block;
    }

    #chat-container::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat-container::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 4px;
      transition: background 0.2s ease;
    }

    /* Show scrollbar ONLY if window is at max height AND (hovered OR scrolling) */
    #chat-container.at-max-height:hover::-webkit-scrollbar-thumb,
    #chat-container.at-max-height.scrolling::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
    }

    #chat-container.at-max-height:hover::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }

    /* Dark theme scrollbar */
    body.stealth-mode #chat-container.at-max-height:hover::-webkit-scrollbar-thumb,
    body.stealth-mode #chat-container.at-max-height.scrolling::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
    }

    body.stealth-mode #chat-container.at-max-height:hover::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Hidden context menu */
    .context-menu {
      display: none;
    }

    /* History Panel */
    .history-panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      z-index: 100;
      -webkit-app-region: no-drag;
      height: 100%;
    }

    /* Dark theme for history panel */
    body.stealth-mode .history-panel {
      background: rgb(20, 20, 20);
    }

    body.stealth-mode .history-header {
      border-bottom: 1px solid var(--border-subtle);
    }

    body.stealth-mode .history-header h3 {
      color: var(--text-primary) !important;
    }

    body.stealth-mode .history-item {
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.03);
    }

    body.stealth-mode .history-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-bright);
    }

    body.stealth-mode .history-item-title {
      color: var(--text-primary) !important;
    }

    body.stealth-mode .history-item-preview,
    body.stealth-mode .history-item-date {
      color: var(--text-secondary) !important;
    }

    body.stealth-mode .history-delete-btn {
      color: var(--text-secondary) !important;
    }

    body.stealth-mode .history-delete-btn:hover {
      color: #ff4d4d !important;
      background: rgba(255, 77, 77, 0.1);
    }

    body.stealth-mode .history-empty {
      color: var(--text-secondary) !important;
    }

    body.stealth-mode .history-list.at-max-height:hover::-webkit-scrollbar-thumb,
    body.stealth-mode .history-list.at-max-height.scrolling::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
    }

    body.stealth-mode .history-list.at-max-height:hover::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .history-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .history-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      contain: content;
    }

    .history-list::-webkit-scrollbar {
      width: 8px;
    }

    .history-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 4px;
      transition: background 0.2s ease;
    }

    .history-list.at-max-height:hover::-webkit-scrollbar-thumb,
    .history-list.at-max-height.scrolling::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
    }

    .history-list.at-max-height:hover::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }

    /* Attachments */
    .screenshots-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 0;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .screenshots-inline:empty,
    .attached-files:empty {
      display: none;
      margin: 0;
      padding: 0;
    }

    .screenshot-thumb {
      position: relative;
      display: inline-block;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-subtle);
      width: 60px;
      height: 45px;
      flex-shrink: 0;
    }

    .screenshot-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .screenshot-thumb:hover .screenshot-remove {
      opacity: 1;
    }

    .screenshot-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
      padding: 0;
      line-height: 1;
    }

    .screenshot-remove:hover {
      background: rgba(220, 38, 38, 0.9);
    }

    .attached-files {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .attached-file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      font-size: 12px;
    }

    .attached-file-item.blocked {
      border-color: rgba(220, 38, 38, 0.35);
      background: rgba(220, 38, 38, 0.08);
    }

    .attached-file-icon {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      color: var(--text-secondary);
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .attached-file-content {
      flex: 1;
      min-width: 0;
    }

    .attached-file-name {
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attached-file-warning {
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.35;
      color: #b91c1c;
    }

    .attached-file-remove {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.1);
      color: var(--text-secondary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      padding: 0;
      transition: all 0.1s;
    }

    .attached-file-remove:hover {
      background: rgba(220, 38, 38, 0.8);
      color: white;
    }

    /* Screenshots in messages */
    .screenshot-in-message {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .screenshot-in-message img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .screenshot-in-message img:hover {
      transform: scale(1.02);
    }

    .message-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .message-attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-primary);
      max-width: 100%;
    }

    .message-attachment-chip.blocked {
      border-color: rgba(220, 38, 38, 0.3);
      color: #b91c1c;
    }

    .message-attachment-icon {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    .message-attachment-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Image Modal */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .image-modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
      border: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.02);
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto;
      gap: 4px 8px;
      align-items: center;
    }

    .history-item:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .history-item-header {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-item-preview {
      grid-column: 1;
      grid-row: 2;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.4;
    }

    .history-item-date {
      grid-column: 1;
      grid-row: 3;
      font-size: 11px;
      color: var(--text-secondary);
      opacity: 0.7;
      white-space: nowrap;
      margin-top: 2px;
    }

    .history-item-actions {
      grid-column: 2;
      grid-row: 1 / 4;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .history-item:hover .history-item-actions {
      opacity: 1;
    }

    .history-delete-btn {
      padding: 6px;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .history-delete-btn:hover {
      background: rgba(220, 38, 38, 0.1);
      color: #dc2626;
    }

    .history-delete-btn:active {
      transform: scale(0.9);
    }

    .history-delete-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .history-item-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item-date {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      opacity: 0.7;
    }

    .history-empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-secondary);
      font-size: 14px;
    }


    /* Opacity Controls - removed from chat window, now only in settings */

    /* Highlight.js Theme - Light Theme (Atom One Light) */
    pre code.hljs {
      display: block;
      overflow-x: auto;
      padding: 1em
    }

    code.hljs {
      padding: 3px 5px
    }

    /* Light theme (default) */
    body:not(.stealth-mode) .hljs {
      color: #383a42;
      background: #fafafa;
      border-radius: 6px;
    }

    body:not(.stealth-mode) .hljs-comment,
    .hljs-quote {
      color: #a0a1a7;
      font-style: italic
    }

    body:not(.stealth-mode) .hljs-doctag,
    .hljs-keyword,
    .hljs-formula {
      color: #a626a4
    }

    body:not(.stealth-mode) .hljs-section,
    .hljs-name,
    .hljs-selector-tag,
    .hljs-deletion,
    .hljs-subst {
      color: #e45649
    }

    body:not(.stealth-mode) .hljs-literal {
      color: #0184bb
    }

    body:not(.stealth-mode) .hljs-string,
    .hljs-regexp,
    .hljs-addition,
    .hljs-attribute,
    .hljs-meta {
      color: #50a14f
    }

    body:not(.stealth-mode) .hljs-attr,
    .hljs-variable,
    .hljs-template-variable,
    .hljs-type,
    .hljs-selector-class,
    .hljs-selector-attr,
    .hljs-selector-pseudo,
    .hljs-number {
      color: #986801
    }

    body:not(.stealth-mode) .hljs-symbol,
    .hljs-bullet,
    .hljs-link,
    .hljs-meta .hljs-keyword,
    .hljs-selector-id,
    .hljs-title {
      color: #4078f2
    }

    body:not(.stealth-mode) .hljs-built_in,
    .hljs-title.class_,
    .hljs-class .hljs-title {
      color: #c18401
    }

    body:not(.stealth-mode) .hljs-emphasis {
      font-style: italic
    }

    body:not(.stealth-mode) .hljs-strong {
      font-weight: bold
    }

    body:not(.stealth-mode) .hljs-link {
      text-decoration: underline
    }

    /* Dark theme (stealth mode) */
    body.stealth-mode .hljs {
      color: #abb2bf;
      background: #282c34;
      border-radius: 6px;
    }

    body.stealth-mode .hljs-comment,
    .hljs-quote {
      color: #5c6370;
      font-style: italic
    }

    body.stealth-mode .hljs-doctag,
    .hljs-keyword,
    .hljs-formula {
      color: #c678dd
    }

    body.stealth-mode .hljs-section,
    .hljs-name,
    .hljs-selector-tag,
    .hljs-deletion,
    .hljs-subst {
      color: #e06c75
    }

    body.stealth-mode .hljs-literal {
      color: #56b6c2
    }

    body.stealth-mode .hljs-string,
    .hljs-regexp,
    .hljs-addition,
    .hljs-attribute,
    .hljs-meta {
      color: #98c379
    }

    body.stealth-mode .hljs-attr,
    .hljs-variable,
    .hljs-template-variable,
    .hljs-type,
    .hljs-selector-class,
    .hljs-selector-attr,
    .hljs-selector-pseudo,
    .hljs-number {
      color: #d19a66
    }

    body.stealth-mode .hljs-symbol,
    .hljs-bullet,
    .hljs-link,
    .hljs-meta .hljs-keyword,
    .hljs-selector-id,
    .hljs-title {
      color: #61aeee
    }

    body.stealth-mode .hljs-built_in,
    .hljs-title.class_,
    .hljs-class .hljs-title {
      color: #e6c07b
    }

    body.stealth-mode .hljs-emphasis {
      font-style: italic
    }

    body.stealth-mode .hljs-strong {
      font-weight: bold
    }

    body.stealth-mode .hljs-link {
      text-decoration: underline
    }

    /* Custom scrollbar for horizontal scrolling in code blocks - hidden by default */
    pre code.hljs::-webkit-scrollbar {
      height: 4px;
    }

    pre code.hljs::-webkit-scrollbar-track {
      background: transparent;
    }

    pre code.hljs::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 2px;
      transition: background 0.2s ease;
    }

    /* Show scrollbar on hover or when scrolling */
    pre:hover code.hljs::-webkit-scrollbar-thumb,
    pre.scrolling code.hljs::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
    }

    pre:hover code.hljs::-webkit-scrollbar-thumb:hover,
    pre.scrolling code.hljs::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }

    /* Stealth mode scrollbar for code blocks */
    body.stealth-mode pre:hover code.hljs::-webkit-scrollbar-thumb,
    body.stealth-mode pre.scrolling code.hljs::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
    }

    body.stealth-mode pre:hover code.hljs::-webkit-scrollbar-thumb:hover,
    body.stealth-mode pre.scrolling code.hljs::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* KaTeX math rendering styles */
    .katex {
      font-size: 1.1em;
    }

    .katex-display {
      margin: 0.8em 0;
    }

    /* Keep the pointer visually stable over the chat overlay. Controls remain clickable/focusable. */
    body:not(.chat-overlay-hoverable) #overlay,
    body:not(.chat-overlay-hoverable) #overlay *,
    body:not(.chat-overlay-hoverable) #overlay *::before,
    body:not(.chat-overlay-hoverable) #overlay *::after {
      cursor: default !important;
    }

    body:not(.chat-overlay-hoverable) #chat-container.at-max-height:hover::-webkit-scrollbar-thumb,
    body:not(.chat-overlay-hoverable) #chat-container.at-max-height:hover::-webkit-scrollbar-thumb:hover,
    body:not(.chat-overlay-hoverable) .history-list.at-max-height:hover::-webkit-scrollbar-thumb,
    body:not(.chat-overlay-hoverable) .history-list.at-max-height:hover::-webkit-scrollbar-thumb:hover,
    body:not(.chat-overlay-hoverable) pre:hover code.hljs::-webkit-scrollbar-thumb,
    body:not(.chat-overlay-hoverable) pre:hover code.hljs::-webkit-scrollbar-thumb:hover {
      background: transparent !important;
    }

    body.chat-overlay-text-cursor #overlay,
    body.chat-overlay-text-cursor #overlay *,
    body.chat-overlay-text-cursor #overlay *::before,
    body.chat-overlay-text-cursor #overlay *::after {
      cursor: text !important;
    }

    #chat-container.at-max-height.scrolling::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1) !important;
    }

    body.stealth-mode #chat-container.at-max-height.scrolling::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15) !important;
    }

    .history-list.at-max-height.scrolling::-webkit-scrollbar-thumb,
    pre.scrolling code.hljs::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15) !important;
    }

    body.stealth-mode .history-list.at-max-height.scrolling::-webkit-scrollbar-thumb,
    body.stealth-mode pre.scrolling code.hljs::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15) !important;
    }

    body.chat-overlay-minimal #send-btn,
    body.chat-overlay-minimal #history-btn,
    body.chat-overlay-minimal #attach-file-btn,
    body.chat-overlay-minimal #new-chat-btn,
    body.chat-overlay-minimal #drag-handle {
      display: none !important;
    }

    body.chat-overlay-minimal #input-row {
      padding-right: 12px;
    }

    body.chat-overlay-minimal #chat-input::placeholder {
      color: transparent !important;
    }

    body.chat-overlay-minimal:not(.stealth-mode) #overlay {
      border: none !important;
      box-shadow: none !important;
    }

    body.chat-overlay-minimal:not(.stealth-mode) #overlay::before {
      box-shadow: none !important;
    }

    body.chat-overlay-minimal .message.assistant {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      border-radius: 0 !important;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
    crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05"
    crossorigin="anonymous"></script>
</head>

<body>
  <div id="overlay">
    <div id="input-container">
      <div id="input-row">
        <textarea id="chat-input" placeholder="Ask anything..." rows="1" maxlength="8000" spellcheck="false"></textarea>
        <button id="send-btn">
          <svg class="send-icon" viewBox="0 0 16 16">
            <path d="M8 3v10M8 3l3 3M8 3L5 6" />
          </svg>
          <svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
          <!-- Stop icon (square) for recording state -->
          <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
          <!-- Loading spinner for processing state -->
          <svg class="loading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
        </button>
        <button id="history-btn" class="icon-btn">
          <svg viewBox="0 0 16 16">
            <path d="M3 4h10M3 8h10M3 12h10" />
          </svg>
        </button>
        <button id="attach-file-btn" class="icon-btn" type="button" aria-label="Attach files" title="Attach files">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.375 12.739 10.682 20.43a4.5 4.5 0 1 1-6.364-6.364L15.258 3.127a3 3 0 1 1 4.243 4.243L8.56 18.31a1.5 1.5 0 1 1-2.121-2.121l8.108-8.108" />
          </svg>
        </button>
        <button id="new-chat-btn" class="icon-btn" style="display: none;">
          <svg viewBox="0 0 16 16">
            <path d="M8 3v10M3 8h10" />
          </svg>
        </button>
        <div id="drag-handle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="5" r="1" />
            <circle cx="9" cy="12" r="1" />
            <circle cx="9" cy="19" r="1" />
            <circle cx="15" cy="5" r="1" />
            <circle cx="15" cy="12" r="1" />
            <circle cx="15" cy="19" r="1" />
          </svg>
        </div>
      </div>
      <div id="screenshots-inline" class="screenshots-inline"></div>
      <div id="attached-files" class="attached-files"></div>
      <div id="note-mention-list" class="note-mention-list"></div>
    </div>
    <div id="chat-container"></div>
  </div>

  <!-- Hidden context menu for keyboard shortcuts -->
  <div class="context-menu" id="context-menu">
    <button id="paste-clipboard">Clipboard</button>
    <button id="use-transcript">Transcript</button>
    <button id="clear-chat">Clear</button>
  </div>

  <!-- History Panel -->
  <div id="history-panel" class="history-panel" style="display: none;">
    <div class="history-header">
      <h3>Chat History</h3>
      <button id="close-history-btn" class="icon-btn">
        <svg viewBox="0 0 16 16">
          <path d="M12 4L4 12M4 4l8 8" />
        </svg>
      </button>
    </div>
    <div id="history-list" class="history-list">
      <!-- History items will be inserted here -->
    </div>
  </div>


  <!-- Image Modal -->
  <div id="image-modal" class="image-modal">
    <img id="modal-image" src="" alt="Enlarged view">
  </div>

  <script src="dist/chat.js"></script>
</body>

</html>
