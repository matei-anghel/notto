name: Build and Release

on:
  push:
    tags:
      - 'v*'


# Publishes installers to this repository's Releases with the built-in token; no secrets needed.
permissions:
  contents: write

jobs:
  # ====================
  # Windows Build
  # ====================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after ${attempt} attempts"
              exit 1
            fi

            echo "npm ci failed on attempt ${attempt}; retrying in 20s..."
            sleep 20
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Without this, the installer ships without win-mic-watcher.exe and meeting detection never starts.
      - name: Build Windows Mic Watcher Helper
        run: npm run build:win-helper

      - name: Build Production
        run: npm run build:prod

      - name: Rebuild Native Modules
        run: npm run rebuild:native

      - name: Copy Native Modules
        run: npm run copy:native

      - name: Build & Publish Windows
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ====================
  # macOS Build
  # ====================
  build-macos:
    runs-on: macos-latest
    env:
      # Disable automatic code signing discovery for ad-hoc signing
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after ${attempt} attempts"
              exit 1
            fi

            echo "npm ci failed on attempt ${attempt}; retrying in 20s..."
            sleep 20
          done

      - name: Build Mac Helper
        run: npm run build:mac-helper

      - name: Build Production
        run: npm run build:prod

      - name: Rebuild Native Modules
        run: npm run rebuild:native

      - name: Copy Native Modules
        run: npm run copy:native

      - name: Build & Publish macOS
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ====================
  # Linux Build
  # ====================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after ${attempt} attempts"
              exit 1
            fi

            echo "npm ci failed on attempt ${attempt}; retrying in 20s..."
            sleep 20
          done

      - name: Build Production
        run: npm run build:prod

      - name: Rebuild Native Modules
        run: npm run rebuild:native

      - name: Copy Native Modules
        run: npm run copy:native

      - name: Build & Publish Linux
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
